name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Start MongoDB with initialization
        run: |
          # Build MongoDB image with proper initialization
          docker build -f Dockerfile.mongo --target dev -t coact-mongodb:test .

          # Start MongoDB container
          docker run -d \
            --name mongodb-test \
            -p 27017:27017 \
            -e MONGO_INITDB_DATABASE=iris \
            coact-mongodb:test

      - name: Wait for MongoDB to be ready
        run: bash scripts/healthcheck-mongodb.sh

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv pip install -e ./client

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ -v
        env:
          MONGODB_URL: mongodb://localhost:27017/
          DB_NAME: iris_test_unit
          ADMIN_USERNAMES: admin
          LOG_LEVEL: INFO

      - name: Run integration tests
        run: |
          # Stub user-lookup (canned synthetic data) so CI never calls a real SLAC service
          python tests/stubs/user_lookup_stub.py 8099 &
          timeout 30 bash -c 'until curl -s -o /dev/null localhost:8099/; do sleep 1; done'

          # Start the API server in background
          uv run uvicorn main:app --host 0.0.0.0 --port 8001 &
          API_PID=$!

          # Wait for the server to be ready
          timeout 30 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8001/docs)" != "200" ]]; do sleep 1; done'
          echo "✅ API server ready"

          # Run integration tests
          REMOTE_USER=regular_user uv run pytest tests/integration/ -v --tb=short
        env:
          MONGODB_URL: mongodb://localhost:27017/
          DB_NAME: iris
          ADMIN_USERNAMES: admin
          LOG_LEVEL: INFO
          USERNAME_FIELD: REMOTE_USER
          COACT_GRAPHQL_ENDPOINT: http://localhost:8001/graphql
          USER_LOOKUP_URL: http://localhost:8099/graphql
          POSIX_SYNC_USERNAMES: user-lookup-bot
          POSIX_SYNC_MIN_COVERAGE: "0"

      - name: Cleanup
        if: always()
        run: |
          docker stop mongodb-test || true
          docker rm mongodb-test || true
